<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Turni Supermercato</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Turni" />
<style>
  /* ---------------------------------------------------------------------
     TEMA — due palette complete, selezionate da data-tema su <html>.
     Il tema si applica anche a schermo spento (prima che React parta),
     perche' lo script in fondo alla pagina lo imposta subito.
     NOTA: l'immagine esportata e la vista a tutto schermo NON usano queste
     variabili: restano sempre chiare (colori fissi in App.jsx).
     --------------------------------------------------------------------- */
  :root, :root[data-tema="chiaro"] {
    color-scheme: light;
    --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc;
    --line:#e2e8f0; --line-2:#cbd5e1; --line-soft:#f1f5f9;
    --ink:#0f172a; --ink-2:#64748b; --ink-3:#94a3b8; --ink-4:#cbd5e1;
    --accent:#0f172a; --accent-2:#1e293b; --accent-3:#334155; --on-accent:#ffffff;
    /* intestazione: fascia scura in ENTRAMBI i temi (non e' il colore d'accento) */
    --chrome:#0f172a; --chrome-ink:#ffffff; --chrome-sub:#94a3b8;
    --chrome-btn:rgba(255,255,255,.10); --chrome-line:rgba(255,255,255,.16);
    --overlay:rgba(15,23,42,.4); --shadow-btn:0 4px 14px rgba(15,23,42,.25);
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
    --ok:#16a34a; --ok-bg:#f0fdf4;
    --warn-ink:#b45309;
    --sync-ink:#9a3412; --sync-bg:#fff7ed; --sync-line:#fed7aa;
    --info-ink:#1e40af; --info-bg:#eff6ff; --info-line:#bfdbfe;
    --ferie:#0ea5e9; --malattia:#ef4444; --forte:#f97316; --pref:#8b5cf6;
    /* turni */
    --t-m-bg:#fef3e2; --t-m-fg:#b45309; --t-m-bar:#f59e0b; --t-m-line:#f59e0b66;
    --t-i-bg:#eef2ff; --t-i-fg:#4338ca; --t-i-bar:#6366f1; --t-i-line:#6366f166;
    --t-s-bg:#ede9fe; --t-s-fg:#6d28d9; --t-s-bar:#8b5cf6; --t-s-line:#8b5cf666;
    --t-l-bg:#f1f5f9; --t-l-fg:#94a3b8; --t-l-bar:#cbd5e1; --t-l-line:#cbd5e199;
    --t-x-bg:#e2e8f0; --t-x-fg:#64748b; --t-x-bar:#94a3b8; --t-x-line:#94a3b899;
    --boot-ink:#64748b;
  }
  :root[data-tema="scuro"] {
    /* fa disegnare al browser i controlli nativi (calendario, tendine,
       barre di scorrimento) nella loro variante scura */
    color-scheme: dark;
    --bg:#0b0f1a; --surface:#141a28; --surface-2:#1a2131;
    --line:#27314a; --line-2:#33405e; --line-soft:#1e2637;
    --ink:#e9edf6; --ink-2:#94a1b9; --ink-3:#6c7991; --ink-4:#48546c;
    --accent:#3b82f6; --accent-2:#1e2b45; --accent-3:#243453; --on-accent:#ffffff;
    --chrome:#0f1524; --chrome-ink:#f2f5fb; --chrome-sub:#8b98b2;
    --chrome-btn:rgba(255,255,255,.07); --chrome-line:rgba(255,255,255,.13);
    --overlay:rgba(3,6,14,.66); --shadow-btn:0 4px 18px rgba(0,0,0,.5);
    --danger:#f87171; --danger-bg:rgba(248,113,113,.12); --danger-line:rgba(248,113,113,.32);
    --ok:#4ade80; --ok-bg:rgba(74,222,128,.12);
    --warn-ink:#fcc25a;
    --sync-ink:#fdba74; --sync-bg:rgba(251,146,60,.12); --sync-line:rgba(251,146,60,.3);
    --info-ink:#93c5fd; --info-bg:rgba(59,130,246,.12); --info-line:rgba(59,130,246,.3);
    --ferie:#38bdf8; --malattia:#f87171; --forte:#fb923c; --pref:#c4b5fd;
    /* turni: pillole luminose su fondo translucido */
    --t-m-bg:rgba(245,158,11,.15); --t-m-fg:#fcc25a; --t-m-bar:#f59e0b; --t-m-line:rgba(245,158,11,.4);
    --t-i-bg:rgba(129,140,248,.16); --t-i-fg:#a9b6fd; --t-i-bar:#818cf8; --t-i-line:rgba(129,140,248,.4);
    --t-s-bg:rgba(167,139,250,.16); --t-s-fg:#c7b7fe; --t-s-bar:#a78bfa; --t-s-line:rgba(167,139,250,.4);
    --t-l-bg:rgba(148,163,184,.08); --t-l-fg:#68758c; --t-l-bar:#3f4a60; --t-l-line:rgba(148,163,184,.18);
    --t-x-bg:rgba(148,163,184,.16); --t-x-fg:#94a1b9; --t-x-bar:#5b6880; --t-x-line:rgba(148,163,184,.32);
    --boot-ink:#6c7991;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); }
  #root { min-height: 100vh; }
  .boot { display:flex; align-items:center; justify-content:center; height:100vh; font-family:-apple-system,system-ui,sans-serif; color:var(--boot-ink); }
  #errbox { display:none; padding:20px; font-family:-apple-system,system-ui,sans-serif; color:#7f1d1d; background:#fef2f2; margin:16px; border-radius:12px; border:1px solid #fecaca; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  /* i menu a tendina nativi devono restare leggibili nel tema scuro */
  :root[data-tema="scuro"] select option { background:#141a28; color:#e9edf6; }
</style>
<script>
  /* tema applicato PRIMA del rendering, per non far lampeggiare il bianco */
  (function () {
    var t = 'scuro';
    try { if (localStorage.getItem('turni_tema') === 'chiaro') t = 'chiaro'; } catch (e) {}
    document.documentElement.setAttribute('data-tema', t);
    // barra di stato del telefono in tinta con l'intestazione, gia' dal primo avvio
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'chiaro' ? '#0f172a' : '#0f1524');
  })();
</script>
</head>
<body>
<div id="root"><div class="boot">Caricamento…</div></div>
<div id="errbox"></div>
<script>
window.addEventListener('error', function(ev) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display='block'; box.textContent='Errore:\n'+(ev.message||ev.error||'sconosciuto')+(ev.filename?('\n'+ev.filename+':'+ev.lineno):''); }
});
</script>
<script>
{{REACT}}
</script>
<script>
{{REACT_DOM}}
</script>
<script>
{{APP_JS}}
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
