<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Turni Supermercato</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Turni" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #f1f5f9; }
  #root { min-height: 100vh; }
  .boot { display:flex; align-items:center; justify-content:center; height:100vh; font-family:-apple-system,system-ui,sans-serif; color:#64748b; }
  #errbox { display:none; padding:20px; font-family:-apple-system,system-ui,sans-serif; color:#7f1d1d; background:#fef2f2; margin:16px; border-radius:12px; border:1px solid #fecaca; font-size:13px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<div id="root"><div class="boot">Caricamento…</div></div>
<div id="errbox"></div>
<script>
window.addEventListener('error', function(ev) {
  var box = document.getElementById('errbox');
  if (box) { box.style.display='block'; box.textContent='Errore:\n'+(ev.message||ev.error||'sconosciuto')+(ev.filename?('\n'+ev.filename+':'+ev.lineno):''); }
});
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
